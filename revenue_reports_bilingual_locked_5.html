async function unlock(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(E.salt),iterations:E.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(E.iv)},key,dec(E.ct));
 return new TextDecoder().decode(pt);
}
async function go(){const pw=document.getElementById('pw').value,err=document.getElementById('err');err.textContent='';
 try{const html=await unlock(pw);document.open();document.write(html);document.close();}catch(e){err.textContent='Wrong password / Неверный пароль';}}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
